overrides:
    # ESLint and typescript-estree still require minimatch 10; the fix is only in 11+.
    minimatch@<11.0.1: 11.0.1
    # @tailwindcss/typography still pins the vulnerable postcss-selector-parser 6.0.10.
    postcss-selector-parser@<7.1.6: 7.1.6
    # Keep the Vite+ core alias consistent throughout the dependency tree.
    vite@*: 'catalog:'

allowBuilds:
    esbuild: true
    sharp: true
catalog:
    vite: npm:@voidzero-dev/vite-plus-core@1.3.0
    vite-plus: 1.3.0
peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: '*'
minimumReleaseAgeExclude:
    - '@voidzero-dev/vite-plus-core@1.2.0'
    - '@voidzero-dev/vite-plus-darwin-arm64@1.2.0'
    - '@voidzero-dev/vite-plus-darwin-x64@1.2.0'
    - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.2.0'
    - '@voidzero-dev/vite-plus-linux-arm64-musl@1.2.0'
    - '@voidzero-dev/vite-plus-linux-x64-gnu@1.2.0'
    - '@voidzero-dev/vite-plus-linux-x64-musl@1.2.0'
    - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.2.0'
    - '@voidzero-dev/vite-plus-win32-x64-msvc@1.2.0'
    - vite-plus@1.2.0
